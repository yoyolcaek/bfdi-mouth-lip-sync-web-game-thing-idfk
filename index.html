<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>BFDI Mouth Sync Generator</title>
    <style>
        :root {
            --bg-color: #00FF00;
            --ui-panel-bg: rgba(0, 0, 0, 0.6);
            --accent-color: #4CAF50;
            --text-color: #ffffff;
        }

        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
        }

        #app {
            display: flex;
            flex-direction: column;
            width: 100%;
            height: 100%;
            position: relative;
        }

        #canvas-container {
            flex-grow: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #00FF00;
        }

        canvas {
            max-width: 100%;
            max-height: 100%;
            touch-action: none;
        }

        #ui-layer {
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            padding: 20px;
            background: linear-gradient(transparent, rgba(0,0,0,0.8));
            display: flex;
            flex-direction: column;
            gap: 15px;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        #ui-layer.hidden-ui {
            opacity: 0;
        }

        .controls {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            pointer-events: auto;
            margin-top: 5px;
        }

        .tabs {
            display: flex;
            justify-content: center;
            gap: 5px;
            pointer-events: auto;
            margin-bottom: 5px;
        }

        .tab-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            padding: 6px 12px;
            color: white;
            border-radius: 15px;
            cursor: pointer;
            font-size: 12px;
            transition: background 0.2s;
        }

        .tab-btn.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
        }

        .tab-btn[data-set="happy"].active {
            background: #FFD700;
            color: #000;
            border-color: #FFD700;
            box-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
        }

        .tab-btn[data-set="sad"].active {
            background: #4682B4;
            color: #fff;
            border-color: #4682B4;
            box-shadow: 0 0 15px rgba(70, 130, 180, 0.5);
        }

        #active-indicator {
            position: absolute;
            top: 10px;
            left: 10px;
            font-weight: bold;
            font-size: 14px;
            padding: 4px 10px;
            border-radius: 4px;
            pointer-events: none;
            z-index: 10;
        }

        .mode-happy #active-indicator {
            background: #FFD700;
            color: #000;
        }

        .mode-sad #active-indicator {
            background: #4682B4;
            color: #fff;
        }

        button {
            padding: 10px 16px;
            border: 2px solid rgba(255,255,255,0.2);
            border-radius: 25px;
            background-color: #333;
            color: white;
            font-weight: bold;
            font-size: 13px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            transition: transform 0.1s, background-color 0.2s;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        button:active {
            transform: scale(0.95);
        }

        button.recording {
            background-color: #f44336;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        #status {
            text-align: center;
            font-size: 12px;
            color: #ccc;
            pointer-events: none;
            text-shadow: 1px 1px 2px black;
        }

        .hidden {
            display: none;
        }

        #toggle-ui-hint {
            position: absolute;
            top: 10px;
            right: 10px;
            color: white;
            font-size: 10px;
            background: rgba(0,0,0,0.5);
            padding: 4px 8px;
            border-radius: 4px;
            cursor: pointer;
            pointer-events: auto;
            z-index: 100;
        }

        #audio-visualizer {
            width: 100%;
            height: 40px;
            background: rgba(0,0,0,0.05);
            border-radius: 20px;
            overflow: hidden;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <div id="app" class="mode-happy">
        <div id="canvas-container">
            <div id="active-indicator">Happy Mode</div>
            <canvas id="mainCanvas"></canvas>
        </div>
        <div id="toggle-ui-hint">Press 'H' or Tap here to toggle UI</div>
        <div id="ui-layer">
            <div id="audio-visualizer">
                <canvas id="vizCanvas"></canvas>
            </div>
            <div class="tabs">
                <button class="tab-btn active" data-set="happy">😊 Happy</button>
                <button class="tab-btn" data-set="sad">😢 Sad</button>
            </div>
            <div class="controls">
                <button id="recordBtn" title="Use Microphone">
                    <span id="micIcon">🎤</span> 
                    <span id="recordText">Mic</span>
                </button>
                <button id="uploadBtn" title="Upload Audio File">
                    📁 Audio
                </button>
                <button id="uploadVideoBtn" title="Upload Video for Sync">
                    🎬 Video Sync
                </button>
                <button id="restartBtn" title="Restart Media">
                    🔄 Restart
                </button>
                <input type="file" id="audioUpload" accept="audio/*" class="hidden">
                <input type="file" id="videoUpload" accept="video/*" class="hidden">
            </div>
            <div id="status">Ready for green screen sync.</div>
        </div>
    </div>

<script type="importmap">
{
    "imports": {
        "app": "./app.js",
        "renderer": "./renderer.js",
        "audio": "./audio.js",
        "vision": "./vision.js",
        "@mediapipe/tasks-vision": "https://esm.sh/@mediapipe/tasks-vision"
    }
}
</script>
    <script type="module">
        import { init } from 'app';
        init();
    </script>
</body>
</html>
